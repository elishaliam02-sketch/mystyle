# The recipe book and one recipe page, rendered by the real app on a phone.
appId: com.mystyle.app
---
# A slow emulator can show "… isn't responding" over the app.
- runFlow:
    when:
      visible: "Wait"
    commands:
      - tapOn: "Wait"
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "מטבח"
    timeout: 90000
- tapOn: "מטבח"
- scrollUntilVisible:
    element: "ספר המתכונים"
    direction: DOWN
    timeout: 30000
- tapOn: "ספר המתכונים"
- extendedWaitUntil:
    visible: "הפתע אותי"
    timeout: 30000
- takeScreenshot: device-test/06-book
# Narrowed to breakfast so the dish is a short scroll away.
- tapOn: "בוקר"
- scrollUntilVisible:
    element: "שקשוקה ירוקה"
    direction: DOWN
    timeout: 60000
    speed: 20
    visibilityPercentage: 1
    waitToSettleTimeoutMs: 800
    centerElement: true
- tapOn:
    text: "שקשוקה ירוקה"
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ".*פטה.*"
    timeout: 30000
- takeScreenshot: device-test/07-recipe
- scrollUntilVisible:
    element: "איך מכינים"
    direction: DOWN
    timeout: 15000
- takeScreenshot: device-test/08-recipe-steps
