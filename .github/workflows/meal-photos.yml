name: Meal photo contact sheet

# Looks up every meal's photograph on Wikimedia Commons for real, and commits a
# contact sheet of the results.
#
# The search phrases are the one part of the photo feature that cannot be unit
# tested: a phrase can be well formed and still return a picture of the wrong
# thing. This runs the app's own picker against the live API and lays out what
# it chooses, so a wrong photo is caught by looking rather than by a user.
#
# It lives in CI because the development sandbox has no route to Wikimedia.
# Start it by hand after changing any `photo:` phrase in src/kitchen/data.ts.

on:
  # Whatever changes what the picker asks for, or how it picks, re-resolves the
  # photos. The sheet it commits lands in docs/qa, which is deliberately not in
  # this list — otherwise the workflow would keep waking itself up.
  push:
    paths:
      - "src/kitchen/data.ts"
      - "src/kitchen/photo.ts"
      - "scripts/meal-photo-sheet.mjs"
      - "scripts/bundle-meal-photos.mjs"
      - ".github/workflows/meal-photos.yml"
  # Available by hand too, once this file is on the default branch — GitHub only
  # offers a manual run for workflows it can see there.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sheet:
    name: Resolve every meal's photo and lay them out
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium, which composes the sheet
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Look up every meal on Commons
        run: node scripts/meal-photo-sheet.mjs

      # The same choice, saved into the app: one photo per dish, no two dishes
      # sharing one, credits kept. What the phone shows without any network.
      - name: Bundle the photos into the app
        run: node scripts/bundle-meal-photos.mjs

      # A push made with this job's token does not trigger the Checks workflow,
      # so the commit below would reach the branch tip unverified. Verify the
      # generated code here instead.
      - name: Typecheck and unit suites against the new bundle
        run: |
          npx tsc --noEmit
          npm test

      - name: Commit the sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/qa/meal-photos.jpg docs/qa/meal-photos.json assets/meals src/kitchen/mealPhotoAssets.ts
          if git diff --cached --quiet; then
            echo "The photos resolve exactly as they did last time; nothing to commit."
          else
            git commit -m "Refresh the meal photo contact sheet and the bundled photos"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
