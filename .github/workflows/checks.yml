name: Checks

# Everything that must be true before code reaches anyone.
#
# This matters more here than in most projects: an over-the-air update skips
# store review entirely, so a broken push on main is on people's phones within
# minutes. The publish workflow waits for this one to pass.
#
# Runs on every push and pull request, and can be started by hand.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
  # Called by the publish workflow, so an update cannot go out unless this
  # exact job has passed on that exact commit.
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck, tests, web bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The typed contracts do a lot of the work in this codebase — a string
      # added to Hebrew and not to English, or a colour token added to light
      # and not to dark, fails right here.
      - name: Typecheck
        run: npx tsc --noEmit

      # Only what ships to phones (--omit=dev), and only high or critical: the
      # moderate findings are inside Expo's own toolchain and wait on an SDK bump.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

      # Every suite, discovered from the scripts directory rather than listed
      # here — a list in a YAML file is a list somebody forgets to edit, and
      # this one had already fallen behind twice.
      - name: Unit suites
        run: npm test

      # Proves the app still bundles for the platform with the strictest
      # constraints, and produces the dist/ the end-to-end suite drives.
      - name: Web bundle
        run: npx expo export --platform web

      # Install Playwright into node_modules (not saved to package.json — the
      # package stays out of the app's dependencies) so the e2e script's plain
      # `import("playwright")` resolves the same way on the runner as it does
      # locally. Running it through `npx --package` instead left the module in
      # a temp cache that a bare import cannot see, which is the one thing that
      # can silently gate every over-the-air update behind a red check.
      - name: Install Playwright for the end-to-end suite
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium

      # Unit tests prove the engines; this proves the buttons are wired to
      # them, in a real browser, against the real bundle.
      - name: End-to-end
        run: node scripts/e2e.mjs

  # Static security analysis, in parallel with the job above. Same script as
  # `npm run sast` locally; the rules are pinned inside it.
  sast:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Semgrep
        run: pipx install semgrep==1.178.0

      - name: Scan
        run: bash scripts/sast.sh
