name: Bundle the app's food photography

# Downloads the generated dish and food photos listed in
# docs/photos/generated.json, shrinks them into assets/, regenerates the photo
# maps and commits them with a contact sheet. The sandbox cannot reach the
# image host; CI can.

on:
  push:
    paths:
      - "docs/photos/generated.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Download, shrink and bundle the photos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the image tool
        run: npm install --no-save --no-audit --no-fund sharp@0.33.5

      - name: Bundle
        run: node scripts/bundle-generated-photos.mjs

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/meals assets/foods src/kitchen/mealPhotoAssets.ts src/kitchen/foodPhotoAssets.ts docs/qa/generated-photos.jpg
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "Bundle the app's generated food photography"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
