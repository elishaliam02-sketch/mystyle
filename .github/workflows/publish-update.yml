name: Publish OTA update

# Publishes an over-the-air (JS/asset) update to the "preview" channel so the
# installed APEX app picks up the change the next time it opens. Runs on every
# push to main (i.e. when a pull request is merged), and can also be started by
# hand from the GitHub app: Actions -> Publish OTA update -> Run workflow.
#
# One-time setup: add a repository secret named EXPO_TOKEN (an Expo access
# token from expo.dev -> account settings -> Access tokens).
#
# Note: this ships JS/asset changes only. Native changes (new native modules,
# a new icon, an SDK or app-version bump) still need a fresh EAS build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Nothing ships without the checks passing. An OTA update bypasses store
  # review, so this workflow is the only gate between a bad merge and every
  # installed phone — running the suites here rather than trusting that
  # somebody looked is the difference between a policy and a guarantee.
  verify:
    name: Run the checks first
    uses: ./.github/workflows/checks.yml

  update:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish the update
        env:
          # Passed through the environment (not interpolated into the shell) so
          # a commit message with quotes or newlines can't break the command.
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual update' }}
        # --non-interactive matters more than it looks: without it, any prompt
        # eas decides to ask (a branch it wants confirming, a login question)
        # waits for a keypress that a runner can never send, and the job hangs
        # until GitHub's six-hour timeout instead of failing in seconds.
        run: eas update --branch preview --message "$COMMIT_MSG" --non-interactive
