name: Publish OTA update

# Publishes an over-the-air (JS/asset) update to the "preview" channel; the
# installed APEX app downloads and installs it by itself (src/updates). Runs on
# every push to main (a merged pull request) and to the branch the app is
# developed on, whenever the push changes something the app is made of, and
# can also be started by hand: Actions -> Publish OTA update -> Run workflow.
#
# One-time setup: add a repository secret named EXPO_TOKEN (an Expo access
# token from expo.dev -> account settings -> Access tokens).
#
# Note: this ships JS/asset changes only. Native changes (new native modules,
# a new icon, an SDK or app-version bump) still need a fresh EAS build.

on:
  push:
    branches: [main, claude/daily-routine-app-rgxm42]
    # Test screenshots, docs and workflow edits change nothing on the phone.
    paths:
      - app/**
      - src/**
      - assets/**
      - app.json
      - package.json
      - package-lock.json
      - metro.config.js
      - public/**
      - admin/**
  workflow_dispatch:

# One publish at a time, in push order: two at once could land out of order
# and leave phones on the older one.
concurrency:
  group: publish-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Nothing ships without the checks passing. An OTA update bypasses store
  # review, so this workflow is the only gate between a bad merge and every
  # installed phone — running the suites here rather than trusting that
  # somebody looked is the difference between a policy and a guarantee.
  verify:
    name: Run the checks first
    uses: ./.github/workflows/checks.yml

  update:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      # Installed apps ask the "preview" channel for updates; the channel hands
      # out whatever branch it points at. It pointed at none, so every update
      # published to the "preview" branch reached no phone at all. Pointing it
      # here, on every run, keeps that from ever silently breaking again.
      - name: Point the app's channel at the branch updates go to
        run: eas channel:edit preview --branch preview --non-interactive

      - name: Publish the update
        env:
          # Passed through the environment (not interpolated into the shell) so
          # a commit message with quotes or newlines can't break the command.
          COMMIT_MSG: ${{ github.event.head_commit.message || 'Manual update' }}
        # --non-interactive matters more than it looks: without it, any prompt
        # eas decides to ask (a branch it wants confirming, a login question)
        # waits for a keypress that a runner can never send, and the job hangs
        # until GitHub's six-hour timeout instead of failing in seconds.
        run: eas update --branch preview --message "$COMMIT_MSG" --non-interactive

      # Installed apps ask for the "preview" channel; this shows which branch
      # that channel hands out, so an update published to a branch no phone
      # reads is visible here instead of silently reaching nobody.
      - name: Show where installed apps get updates from
        continue-on-error: true
        run: |
          eas channel:view preview --non-interactive || true
          eas update:list --branch preview --limit 3 --non-interactive || true

  # The same app as a website, for iPhones: an APK does not install there.
  # Safari → Share → Add to Home Screen gives it an icon and full screen, and
  # every publish replaces it, so it is always the newest version.
  web:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build the website
        run: npx expo export -p web --output-dir dist

      # The owner console rides along at /admin.html. It holds no secret and the
      # admin function checks the allowlist and a second factor on every call;
      # being on the app's origin means the functions' ALLOWED_ORIGINS already
      # lets it in.
      - name: Add the owner console
        run: cp admin/index.html dist/admin.html

      - name: Put it online
        run: eas deploy --prod --export-dir dist --non-interactive

      # What an iPhone asks for first: the page, a screen opened by its own
      # address, the home-screen icon and the app manifest. The two legal pages
      # are the store listings' public privacy and terms links.
      - name: Check the site answers
        run: |
          for path in / /kitchen /recipes /legal/privacy /legal/terms /admin.html /apple-touch-icon.png /manifest.json; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' "https://mystyle.expo.app$path")
            echo "$code $path"
            [ "$code" = "200" ] || exit 1
          done
          grep -q 'apple-mobile-web-app-capable' <(curl -s https://mystyle.expo.app/) || { echo "home-screen tags missing"; exit 1; }
          grep -q 'APEX — ניהול' <(curl -s https://mystyle.expo.app/admin.html) || { echo "the owner console is not the console"; exit 1; }

      # Informational: whether the functions answer the site's origin (their
      # ALLOWED_ORIGINS secret). Printed, never fatal.
      - name: Can the site reach the functions
        continue-on-error: true
        run: |
          for fn in admin ai; do
            o=$(curl -s -o /dev/null -D - -X OPTIONS "https://vesdfboxetdwymsulpsc.supabase.co/functions/v1/$fn" \
              -H "Origin: https://mystyle.expo.app" -H "Access-Control-Request-Method: POST" | tr -d '\r' | grep -i '^access-control-allow-origin' || true)
            echo "$fn: ${o:-no Access-Control-Allow-Origin for https://mystyle.expo.app}"
          done
