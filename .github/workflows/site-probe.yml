name: Site probe

# Read-only: asks the hosted site what it serves at a few addresses and prints
# the status, content type and page title of each. Runs when this file
# changes, or by hand. Changes nothing anywhere.

on:
  push:
    branches: [claude/daily-routine-app-rgxm42]
    paths: [".github/workflows/site-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: What the site serves
        run: |
          for path in /admin.html /admin /admin/ /admin/index.html /console.html /legal/privacy; do
            curl -s -o body -D head "https://mystyle.expo.app$path" || true
            code=$(head -1 head | tr -d '\r')
            type=$(grep -i '^content-type' head | tr -d '\r')
            loc=$(grep -i '^location' head | tr -d '\r')
            title=$(grep -o '<title>[^<]*' body | head -1)
            echo "$path -> $code | $type | $loc | $title | $(wc -c < body) bytes"
          done

      # Whether the web app may call each server function from its own
      # address: the browser refuses the call unless the answer names it.
      - name: Can the site reach the functions
        run: |
          for fn in admin ai billing; do
            o=$(curl -s -o /dev/null -D - -X OPTIONS "https://vesdfboxetdwymsulpsc.supabase.co/functions/v1/$fn" \
              -H "Origin: https://mystyle.expo.app" -H "Access-Control-Request-Method: POST" | tr -d '\r' | grep -i '^access-control-allow-origin' || true)
            echo "$fn: ${o:-no Access-Control-Allow-Origin for https://mystyle.expo.app}"
          done

      # The web push function: does it answer, and has it a key to sign with?
      # (The public key is public — it is what every browser is handed.)
      - name: Web push is configured
        run: |
          r=$(curl -s -X POST "https://vesdfboxetdwymsulpsc.supabase.co/functions/v1/push" \
            -H "Origin: https://mystyle.expo.app" -H "Content-Type: application/json" -d '{"action":"key"}')
          echo "$r" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.publicKey?("public key, "+Buffer.from(j.publicKey.replace(/-/g,"+").replace(/_/g,"/"),"base64").length+" bytes"):("no key: "+s.slice(0,120)))}catch{console.log("not JSON: "+s.slice(0,120))}})'
