name: Test the APK on an Android phone

# Installs a built APK on an Android emulator and uses it the way a person
# does (scripts/device-test.sh, e2e/device/*.yaml): scan a meal photo from the
# gallery, log it, open the recipe book. Screenshots and the phone's log are
# kept as the "device-test" artifact. Runs after every APK build, and on a
# push that changes the test itself (against the latest APK built).

on:
  push:
    paths:
      - e2e/device/**
      - scripts/device-test.sh
      - scripts/device-seed.mjs
      - scripts/device-photo.mjs
      - .github/workflows/device-test.yml
  # By hand, e.g. to re-test an over-the-air update against the latest APK.
  workflow_dispatch:
  workflow_call:
    inputs:
      apk_run_id:
        type: string
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Pick the APK
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.apk_run_id }}
        run: |
          id="$RUN_ID"
          # The newest build that produced an APK (the run as a whole can be
          # red because this very test failed on it).
          # The lookup goes through the GitHub API, which now and then answers
          # nothing; it is tried a few times before giving up.
          for attempt in 1 2 3; do
            [ -n "$id" ] && break
            for r in $(gh run list -R "$GITHUB_REPOSITORY" --workflow build-app.yml --status completed --limit 10 --json databaseId -q '.[].databaseId' || true); do
              if [ -n "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$r/artifacts" -q '.artifacts[] | select(.name == "apex-apk" and (.expired | not)) | .id' || true)" ]; then
                id=$r; break
              fi
            done
            [ -n "$id" ] || sleep 10
          done
          if [ -z "$id" ]; then
            echo "::error::No APK build found to test"
            exit 1
          fi
          echo "Testing the APK from run $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Get the APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: apex-apk
          run-id: ${{ steps.apk.outputs.id }}
          github-token: ${{ github.token }}

      - name: Set up Java for Maestro
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      # A pinned release, checked against its known checksum before it runs.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.10.0"
          MAESTRO_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/maestro" "$HOME/.maestro"
          rm maestro.zip
          "$HOME/.maestro/bin/maestro" --version

      # A camera-sized (12 MP) food photo for the gallery: a small test picture
      # never showed what a real photo costs in memory.
      - name: Make a camera-sized test photo
        run: |
          npm install --silent --no-save --no-package-lock --ignore-scripts --prefix "$RUNNER_TEMP/photo" jpeg-js@0.4.4
          mkdir -p node_modules && ln -sfn "$RUNNER_TEMP/photo/node_modules/jpeg-js" node_modules/jpeg-js
          node scripts/device-photo.mjs shakshuka.jpg
          node scripts/device-photo.mjs nonfood.jpg nonfood

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Use the app on the emulator
        uses: ReactiveCircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b # v2.35.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/device-test.sh

      # Artifacts cannot be opened everywhere the app is worked on, so small
      # copies of the screenshots go into the branch too (docs/qa/device).
      - name: Commit the screenshots
        if: always() && github.ref_type == 'branch'
        run: |
          # A run that never reached the emulator has nothing to show and must
          # not wipe the last good screenshots.
          if ! ls device-test/*.png > /dev/null 2>&1; then exit 0; fi
          (sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick) > /dev/null 2>&1 || true
          rm -rf docs/qa/device && mkdir -p docs/qa/device
          find device-test -name '*.png' -not -path '*/.maestro/*' | while read -r f; do
            convert "$f" -resize 432x -quality 70 "docs/qa/device/$(basename "${f%.png}").jpg" || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/qa/device
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Device test screenshots"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 5
          done

      - name: Keep screenshots and the phone's log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-test
          path: device-test
          retention-days: 14
