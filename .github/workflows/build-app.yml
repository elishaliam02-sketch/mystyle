name: Build the app (APK)

# Builds a fresh installable Android app. Run it by hand from the GitHub app:
# Actions -> "Build the app (APK)" -> Run workflow.
#
# Use this (rather than the OTA update) when something native changed — a new
# icon or splash, an app-version bump, or a new native module — or when an
# installed copy is too old to take OTA updates. Everyday JS and UI changes
# reach the installed app through "Publish OTA update" instead.
#
# Two ways to build:
#   local (default) — the APK is built right here on GitHub's runner with
#     `eas build --local`. It does not use Expo's build quota at all, which is
#     what ran out on the free plan and blocked a build for weeks. It still
#     signs with the same keystore Expo holds for this project, so it installs
#     over the existing app without wiping anyone's data. The APK is attached
#     to a GitHub release (a direct download link on the phone) and kept as a
#     run artifact too.
#   cloud — the old path: queue the build on Expo's servers (counts against the
#     plan's monthly builds); the APK then appears on expo.dev under Builds.

on:
  workflow_dispatch:
    inputs:
      builder:
        description: "Where to build: local (free, on GitHub) or cloud (Expo, uses quota)"
        type: choice
        options: [local, cloud]
        default: local

permissions:
  contents: write

jobs:
  local:
    if: ${{ inputs.builder != 'cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for the Android build
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The runner ships with ~20 GB of toolchains this build never touches
      # (.NET, Haskell, Swift, CodeQL, Boost). An Android build needs the
      # space: the previous run filled the disk and the runner died mid-build
      # with no log at all. The Android SDK itself is left alone.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/lib/heroku \
            "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      # The runner has 7 GB of RAM, and a React Native build compiling native
      # code runs past it: the OS killed the Gradle daemon mid-build ("daemon
      # disappeared unexpectedly"). Swap turns that kill into a slowdown. It
      # goes on the scratch disk (/mnt) when that has room — checked with sudo,
      # since /mnt belongs to root and a plain writability test always failed.
      - name: Give the runner swap space
        run: |
          SWAP=/apex.swap
          if sudo test -d /mnt; then
            FREE_MNT=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
            if [ "${FREE_MNT:-0}" -gt 12 ]; then SWAP=/mnt/apex.swap; fi
          fi
          echo "swap file: $SWAP"
          sudo fallocate -l 6G "$SWAP"
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h
          df -h / /mnt || true

      # The `apk-local` profile (eas.json) is `preview` — same channel, so OTA
      # updates still reach it — minus the release lint pass. That pass is what
      # sank run #21: the whole APK had compiled in twenty minutes when
      # async-storage's lintVitalAnalyzeRelease failed, and the build then sat
      # hung until the time limit. Lint checks source; it adds nothing to the
      # APK, and `npm test` + tsc already gate every change.
      #
      # One CPU architecture instead of four. arm64-v8a is every Android phone
      # sold in the last several years; building armeabi-v7a, x86 and x86_64 as
      # well quadrupled the native compile and ran past the time limit. Two
      # Gradle workers keep peak memory inside what the runner has.
      - name: Build the APK on this runner
        env:
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          GRADLE_OPTS: -Dorg.gradle.workers.max=2
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: eas build --platform android --profile apk-local --local --non-interactive --output apex.apk

      - name: Keep the APK as a run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-apk
          path: apex.apk
          retention-days: 30

      # Run #22 built the APK and then failed here with "Resource not accessible
      # by integration": this repository's token may not create releases. The
      # APK is already safe as the run artifact above, so a refused release no
      # longer marks a good build as failed.
      - name: Publish the APK as a downloadable release
        continue-on-error: true
        # The branch name is chosen by whoever pushed it, so it reaches the shell
        # as a variable, never pasted into the script as text.
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="apk-$RUN_NUMBER"
          gh release create "$TAG" apex.apk \
            --target "$SHA" \
            --title "APEX APK #$RUN_NUMBER" \
            --notes "Built from $REF_NAME at $SHA. Open this page on the phone, tap apex.apk, and install." \
            --prerelease

  cloud:
    if: ${{ inputs.builder == 'cloud' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # 8.2.1
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait queues the build on Expo and returns; the job does not sit
      # burning CI minutes while Expo's free queue works through it.
      - name: Queue the Android build
        run: eas build --platform android --profile preview --non-interactive --no-wait
