name: Deploy server (Supabase)

# Runs the database migrations and deploys the three edge functions (ai,
# billing, admin) to the Supabase project — the "needs by hand" steps, done from
# a phone: change supabase/deploy-request.txt (or, once this file is on the
# default branch, Actions -> "Deploy server (Supabase)" -> Run workflow).
#
# One-time setup: a Supabase personal access token saved as the repository
# secret SUPABASE_ACCESS_TOKEN (Supabase: Account -> Access Tokens; GitHub:
# Settings -> Secrets and variables -> Actions). The token never appears in the
# code or the logs.
#
# Every migration is written to be re-runnable (IF NOT EXISTS, guarded DO
# blocks, CREATE OR REPLACE), so running this twice is harmless.

on:
  # GitHub offers "Run workflow" only for workflows on the default branch, and
  # this one lives on the working branch — so it also runs when the request
  # file below changes. Editing that file (any change) is the button.
  push:
    branches: [claude/daily-routine-app-rgxm42]
    paths: ["supabase/deploy-request.txt"]
  workflow_dispatch:
    inputs:
      what:
        description: "What to deploy"
        type: choice
        options: [all, sql, functions]
        default: all

permissions:
  contents: read

env:
  PROJECT_REF: vesdfboxetdwymsulpsc
  # The CLI is pinned so a deploy tomorrow behaves like the one tested today.
  SUPABASE_CLI: supabase@2.117.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the repository secret SUPABASE_ACCESS_TOKEN first (see the top of this file)."
            exit 1
          fi

      # Through the Management API's query endpoint: the same as pasting each
      # file into the SQL editor, in order, stopping at the first error.
      - name: Run the database migrations
        if: ${{ inputs.what != 'functions' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # 002 (sync columns) and 003 (the backups table) are included because
          # this project never ran them — 007 failed on a missing public.backups.
          # Both are re-runnable. 004 is left out on purpose: 006 replaces its
          # delete_my_account with the version that demands a recent sign-in,
          # and running 004 after it would put the weaker one back. 005 (admin)
          # was run by hand and its policies are not guarded against a re-run.
          for f in supabase/migration-002-sync.sql supabase/migration-003-backup.sql \
                   supabase/migration-006-security.sql supabase/migration-007-limits.sql; do
            echo "== $f"
            node -e 'process.stdout.write(JSON.stringify({ query: require("fs").readFileSync(process.argv[1], "utf8") }))' "$f" > body.json
            code=$(curl -sS -o out.json -w "%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @body.json)
            echo "HTTP $code"
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              cat out.json
              exit 1
            fi
          done
          rm -f body.json out.json

      # --no-verify-jwt: each function verifies its caller itself (getUser with
      # the service key), and Stripe's webhook is not a signed-in user.
      # --use-api bundles on Supabase's side, so no Docker is needed.
      - name: Deploy the edge functions
        if: ${{ inputs.what != 'sql' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ai billing admin; do
            echo "== $fn"
            npx --yes "$SUPABASE_CLI" functions deploy "$fn" \
              --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
