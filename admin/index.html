<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- Only the pinned supabase-js file and the one inline script below may run;
     the inline script is allowed by its hash, which scripts/run-csp-tests.mjs
     recomputes - edit the script and that test prints the new hash. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js 'sha256-vMvSsoPgZzZllpISSy27c6P2ptfhfpHdPaKrYV/Mqp8='; style-src 'unsafe-inline'; img-src data:; connect-src https://vesdfboxetdwymsulpsc.supabase.co; base-uri 'none'; form-action 'none'" />
<meta name="referrer" content="no-referrer" />
<title>APEX — ניהול</title>
<!--
  APEX owner console — the monitoring window.

  A single self-contained page. It signs in with an ADMIN account (an account
  whose id is in the `admins` table), then calls the `admin` edge function,
  which is the only thing that can read across users and which checks the admin
  allowlist itself on every call. This page holds no secret: the key below is
  the public publishable key the app already ships, and it grants nothing on its
  own — every privileged read is gated server-side by the admin check.

  To use it: host this file (Netlify, Vercel, Cloudflare Pages, or locally with
  `npx serve admin`) and add that address to the functions' ALLOWED_ORIGINS
  secret; opened straight from disk it has no origin and the function will not
  answer it. Sign in with the admin email + password, then the code from an
  authenticator app — the first sign-in shows a QR code to enroll one. It
  refreshes itself every 30 seconds.
-->
<style>
  :root {
    --bg: #0b0d12; --panel: #141821; --panel2: #1b212c; --line: #263041;
    --ink: #eef2f8; --soft: #9aa7bd; --faint: #6b7688;
    --violet: #9b6bff; --green: #46d19b; --blue: #4aa3ff; --amber: #f2b34a;
    --red: #ff6b6b; --gray: #8b95a7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Heebo, Arial, sans-serif; }
  a { color: var(--violet); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px 16px 64px; }

  /* login */
  .login { max-width: 360px; margin: 12vh auto; background: var(--panel);
    border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
  .login h1 { margin: 0 0 4px; font-size: 22px; }
  .login p { margin: 0 0 18px; color: var(--soft); font-size: 14px; }
  input { width: 100%; padding: 12px 14px; margin: 6px 0; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; color: var(--ink); font-size: 15px; }
  button { cursor: pointer; border: 0; border-radius: 10px; padding: 12px 16px;
    background: var(--violet); color: #fff; font-weight: 700; font-size: 15px; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--soft); }
  .err { color: var(--red); font-size: 14px; margin-top: 8px; min-height: 18px; }
  .full { width: 100%; margin-top: 8px; }
  .qr { display: block; width: 200px; height: 200px; margin: 0 auto 10px; background: #fff;
    border-radius: 10px; padding: 8px; }
  code { direction: ltr; unicode-bidi: embed; word-break: break-all; color: var(--ink); }

  /* dashboard */
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; }
  header .who { color: var(--soft); font-size: 13px; }
  header .spacer { flex: 1; }
  .muted { color: var(--faint); font-size: 12px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; }
  .card .n { font-size: 30px; font-weight: 800; }
  .card .l { color: var(--soft); font-size: 13px; margin-top: 2px; }

  .section-title { font-size: 15px; color: var(--soft); margin: 22px 0 10px; font-weight: 700; }

  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 720px; }
  th, td { text-align: right; padding: 11px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--faint); font-weight: 600; font-size: 12px; background: var(--panel); position: sticky; top: 0; }
  tr:last-child td { border-bottom: 0; }
  td.email { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }

  .badge { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .b-on-track { background: rgba(70,209,155,.16); color: var(--green); }
  .b-slow { background: rgba(74,163,255,.16); color: var(--blue); }
  .b-fast { background: rgba(242,179,74,.18); color: var(--amber); }
  .b-stalled { background: rgba(139,149,167,.18); color: var(--gray); }
  .b-off-track { background: rgba(255,107,107,.16); color: var(--red); }
  .b-no-data { background: rgba(139,149,167,.1); color: var(--faint); }

  .sub-active { color: var(--green); }
  .sub-trialing { color: var(--blue); }
  .sub-past_due, .sub-canceled, .sub-expired { color: var(--amber); }
  .sub-none { color: var(--faint); }

  .audit { display: grid; gap: 6px; }
  .audit .row { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 12px; font-size: 13px; display: flex; gap: 10px; }
  .audit .k { color: var(--violet); font-weight: 700; }
  .audit .t { color: var(--faint); }
</style>
</head>
<body>
<div class="wrap">
  <!-- LOGIN -->
  <div id="login" class="login">
    <h1>APEX — ניהול</h1>
    <p>התחבר עם חשבון האדמין.</p>
    <input id="email" type="email" placeholder="אימייל" autocomplete="username" />
    <input id="password" type="password" placeholder="סיסמה" autocomplete="current-password" />
    <button id="signin" style="width:100%; margin-top:8px;">התחבר</button>
    <div id="loginErr" class="err"></div>
  </div>

  <!-- SECOND FACTOR: the admin function refuses any session without one -->
  <div id="mfa" class="login" hidden>
    <h1>אימות דו־שלבי</h1>
    <p id="mfaIntro"></p>
    <div id="mfaEnroll" hidden>
      <img id="mfaQr" class="qr" alt="QR" />
      <p class="muted">אין סורק? הקלד את המפתח ידנית: <code id="mfaSecret"></code></p>
    </div>
    <input id="mfaCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="קוד בן 6 ספרות" />
    <button id="mfaVerify" class="full">אמת</button>
    <button id="mfaCancel" class="ghost full">התנתק</button>
    <div id="mfaErr" class="err"></div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" hidden>
    <header>
      <h1>לוח בקרה</h1>
      <span id="who" class="who"></span>
      <span class="spacer"></span>
      <span id="refreshInfo" class="muted"></span>
      <button id="signout" class="ghost">התנתק</button>
    </header>

    <div id="cards" class="cards"></div>

    <div class="section-title">משתמשים</div>
    <div class="tablewrap">
      <table>
        <thead>
          <tr>
            <th>אימייל</th><th>נרשם</th><th>חובר לאחרונה</th>
            <th>מנוי</th><th>מגמה</th><th>שקילה אחרונה</th><th>שינוי/שבוע</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <div class="section-title">יומן פעילות (audit)</div>
    <div id="audit" class="audit"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous"></script>
<script>
  const SUPABASE_URL = "https://vesdfboxetdwymsulpsc.supabase.co";
  const SUPABASE_KEY = "sb_publishable_QJJEFeAVnwdJDwdVpOHjFA_un6l0Of_";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
  });

  const $ = (id) => document.getElementById(id);
  const TRAJ_HE = { "on-track": "במסלול", slow: "איטי", fast: "מהיר", stalled: "תקוע", "off-track": "סוטה", "no-data": "אין נתונים" };
  const SUB_HE = { active: "פעיל", trialing: "ניסיון", past_due: "חוב", canceled: "בוטל", expired: "פג", none: "—" };

  function fmtDate(iso) {
    if (!iso) return "—";
    const d = new Date(iso);
    if (isNaN(+d)) return "—";
    return d.toLocaleDateString("he-IL", { day: "2-digit", month: "2-digit", year: "2-digit" });
  }
  function fmtAgo(iso) {
    if (!iso) return "מעולם";
    const d = new Date(iso);
    if (isNaN(+d)) return "—";
    const mins = Math.floor((Date.now() - +d) / 60000);
    if (mins < 1) return "עכשיו";
    if (mins < 60) return `לפני ${mins} דק׳`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `לפני ${hrs} ש׳`;
    const days = Math.floor(hrs / 24);
    return `לפני ${days} ימים`;
  }

  async function call(action, extra) {
    const { data, error } = await db.functions.invoke("admin", { body: { action, ...(extra || {}) } });
    if (error) {
      // Surface the real reason (status + the function's error code) rather than
      // collapsing everything to a blank failure.
      let detail = error.message || "שגיאה";
      let code = null;
      try {
        if (error.context && typeof error.context.json === "function") {
          const status = error.context.status;
          const b = await error.context.json();
          code = b && b.error ? b.error : null;
          detail = (status ? status + " · " : "") + (code || JSON.stringify(b));
        } else if (error.context && typeof error.context.status !== "undefined") {
          detail = String(error.context.status);
        }
      } catch (_) { /* keep error.message */ }
      const err = new Error(detail);
      err.code = code;
      throw err;
    }
    return data;
  }

  async function refresh() {
    try {
      const [ov, us, au] = await Promise.all([call("overview"), call("users", { page: 1 }), call("audit", { limit: 60 })]);
      renderCards(ov);
      renderUsers(us.users || []);
      renderAudit(au.events || []);
      $("refreshInfo").textContent = "עודכן " + new Date().toLocaleTimeString("he-IL");
    } catch (e) {
      $("refreshInfo").textContent = "שגיאה בטעינה — " + (e && e.message ? e.message : "נסה שוב");
    }
  }

  // Built with DOM calls, never innerHTML: every value here comes from the
  // server, and text set as text can never become markup.
  function el(tag, cls, ...children) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    for (const c of children) node.append(c instanceof Node ? c : String(c));
    return node;
  }

  function renderCards(ov) {
    const t = ov.trajectory || {};
    const cards = [
      { n: ov.totalUsers ?? 0, l: "משתמשים" },
      { n: ov.paying ?? 0, l: "מנויים פעילים (כולל ניסיון)" },
      { n: ov.progressing ?? 0, l: "בתהליך ירידה טוב" },
      { n: (t["off-track"] ?? 0) + (t.stalled ?? 0), l: "תקועים / סוטים" },
    ];
    $("cards").replaceChildren(...cards.map((c) => el("div", "card", el("div", "n", c.n), el("div", "l", c.l))));
  }

  function renderUsers(users) {
    if (!users.length) {
      const empty = el("td", "muted", "אין עדיין משתמשים");
      empty.colSpan = 7;
      $("usersBody").replaceChildren(el("tr", null, empty));
      return;
    }
    $("usersBody").replaceChildren(...users.map((u) => {
      const traj = u.trajectory || "no-data";
      const sub = (u.subscription && u.subscription.status) || "none";
      const perWeek = (u.perWeek == null) ? "—" : (u.perWeek > 0 ? "+" : "") + u.perWeek + " ק״ג";
      const lastW = (u.lastWeighInDaysAgo == null) ? "—" : (u.lastWeighInDaysAgo === 0 ? "היום" : `לפני ${u.lastWeighInDaysAgo} ימים`);
      return el("tr", null,
        el("td", "email", u.email || "—"),
        el("td", null, fmtDate(u.createdAt)),
        el("td", null, fmtAgo(u.lastSignInAt)),
        el("td", "sub-" + sub, SUB_HE[sub] || sub),
        el("td", null, el("span", "badge b-" + traj, TRAJ_HE[traj] || traj)),
        el("td", null, lastW),
        el("td", null, perWeek));
    }));
  }

  function renderAudit(events) {
    if (!events.length) { $("audit").replaceChildren(el("div", "muted", "אין עדיין רשומות")); return; }
    $("audit").replaceChildren(...events.map((e) =>
      el("div", "row", el("span", "k", e.kind || ""), el("span", "t", fmtAgo(e.at)))));
  }

  let timer = null;
  async function showDash(session) {
    $("login").hidden = true;
    $("dash").hidden = false;
    $("who").textContent = "מחובר כ־" + (session.user.email || "");
    await refresh();
    if (timer) clearInterval(timer);
    timer = setInterval(refresh, 30000);
  }
  function showLogin() {
    if (timer) clearInterval(timer);
    $("dash").hidden = true;
    $("mfa").hidden = true;
    $("login").hidden = false;
  }

  // Asks the server before showing anything: it answers only an admin, and
  // only one who has passed a second factor this session.
  async function enter(session) {
    try {
      await call("overview");
    } catch (e) {
      if (e && e.code === "mfa-required") return startMfa();
      await db.auth.signOut();
      showLogin();
      $("loginErr").textContent = "שגיאת שרת: " + (e && e.message ? e.message : e);
      return;
    }
    showDash(session);
  }

  // A verified authenticator gets a code prompt. None yet means this is the
  // admin's first sign-in since two-step was required: enroll one now. Enrolling
  // a second factor once one is verified needs that factor, so a stolen
  // password cannot swap in the thief's phone.
  let mfaFactorId = null;
  async function startMfa() {
    $("mfaErr").textContent = "";
    $("mfaCode").value = "";
    try {
      const { data: f, error } = await db.auth.mfa.listFactors();
      if (error) throw error;
      const all = (f && f.all) || [];
      const verified = all.find((x) => x.factor_type === "totp" && x.status === "verified");
      if (verified) {
        mfaFactorId = verified.id;
        $("mfaEnroll").hidden = true;
        $("mfaIntro").textContent = "הזן את הקוד מאפליקציית האימות שלך.";
      } else {
        for (const x of all) if (x.status !== "verified") await db.auth.mfa.unenroll({ factorId: x.id });
        const { data: e, error: ee } = await db.auth.mfa.enroll({ factorType: "totp" });
        if (ee) throw ee;
        mfaFactorId = e.id;
        const qr = e.totp.qr_code || "";
        $("mfaQr").src = qr.startsWith("data:") ? qr : "data:image/svg+xml;charset=utf-8," + encodeURIComponent(qr);
        $("mfaSecret").textContent = e.totp.secret || "";
        $("mfaEnroll").hidden = false;
        $("mfaIntro").textContent = "פעם ראשונה: סרוק את הקוד באפליקציית אימות (Google Authenticator, 1Password, Authy) והזן את הקוד שהיא מציגה.";
      }
    } catch (e) {
      await db.auth.signOut();
      showLogin();
      $("loginErr").textContent = "אימות דו־שלבי לא זמין: " + (e && e.message ? e.message : e);
      return;
    }
    $("login").hidden = true;
    $("dash").hidden = true;
    $("mfa").hidden = false;
    $("mfaCode").focus();
  }

  $("mfaVerify").addEventListener("click", async () => {
    $("mfaErr").textContent = "";
    const code = $("mfaCode").value.replace(/\s/g, "");
    if (!/^\d{6}$/.test(code)) { $("mfaErr").textContent = "הקוד הוא 6 ספרות."; return; }
    const { error } = await db.auth.mfa.challengeAndVerify({ factorId: mfaFactorId, code });
    if (error) { $("mfaErr").textContent = "הקוד לא התקבל: " + (error.message || "נסה שוב"); return; }
    $("mfa").hidden = true;
    const { data } = await db.auth.getSession();
    await enter(data.session);
  });
  $("mfaCode").addEventListener("keydown", (e) => { if (e.key === "Enter") $("mfaVerify").click(); });
  $("mfaCancel").addEventListener("click", async () => { await db.auth.signOut(); showLogin(); });

  $("signin").addEventListener("click", async () => {
    $("loginErr").textContent = "";
    const email = $("email").value.trim();
    const password = $("password").value;
    const { data, error } = await db.auth.signInWithPassword({ email, password });
    if (error) { $("loginErr").textContent = "התחברות נכשלה: " + (error.message || "בדוק מייל וסיסמה"); return; }
    await enter(data.session);
  });
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") $("signin").click(); });
  $("signout").addEventListener("click", async () => { await db.auth.signOut(); showLogin(); });

  // Resume a stored session on load; enter() re-asks for the code if needed.
  db.auth.getSession().then(({ data }) => { if (data.session) enter(data.session); });
</script>
</body>
</html>
